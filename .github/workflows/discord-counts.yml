# Relève toutes les heures le nombre de membres des communautés (section Projets) et le publie
# sur la branche « data » (discord.json). Le site s'en sert quand Discord ne répond pas depuis
# le navigateur du visiteur. Script : tools/discord_counts.py
name: Chiffres Discord

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - tools/discord_counts.py
      - .github/workflows/discord-counts.yml

permissions:
  contents: write

concurrency:
  group: discord-counts
  cancel-in-progress: false

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Relevé précédent
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:discord.json > "$RUNNER_TEMP/previous.json" || echo '{}' > "$RUNNER_TEMP/previous.json"
          else
            echo '{}' > "$RUNNER_TEMP/previous.json"
          fi

      - name: Relevé des chiffres
        run: python3 tools/discord_counts.py "$RUNNER_TEMP/out/discord.json" "$RUNNER_TEMP/previous.json"

      - name: Publication sur la branche data
        working-directory: ${{ runner.temp }}/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord.json
          git commit -q -m "Chiffres Discord"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
